name: Daily NEC Research

on:
  schedule:
    # JST 07:30 = UTC 22:30
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-nec-research
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required configuration
        id: config_check
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          missing=()
          for name in OPENAI_API_KEY NOTION_TOKEN NOTION_DATABASE_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Missing required GitHub Actions secrets: ${missing[*]}"
            {
              echo "ready=false"
              echo "missing=${missing[*]}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Run NEC daily research
        if: steps.config_check.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python -u main.py

      - name: Report skipped run
        if: steps.config_check.outputs.ready != 'true'
        run: |
          echo "NEC daily research was skipped because required GitHub Actions secrets are missing."
          echo "Missing: ${{ steps.config_check.outputs.missing }}"
